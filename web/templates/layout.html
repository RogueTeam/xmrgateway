{{define "layout"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Monero price API for everyone, on the clearnet and on an onion address.">
  <title>{{block "title" .}}xmrgateway{{end}}</title>
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/pico.orange.min.css">
</head>
<body>
  <header class="container">
    <nav>
      <ul>
        <li><a href="/"><img src="/static/logo.svg" alt="" width="32" height="32"></a></li>
        <li><a href="/" class="contrast"><strong>xmrgateway</strong></a></li>
      </ul>
      <ul>
        <li><a href="/docs">API</a></li>
        <li><a href="/#about">About</a></li>
        <li><a href="/#donate">Donate</a></li>
      </ul>
    </nav>
  </header>
  <main class="container">
    {{block "content" .}}{{end}}
  </main>
  <footer class="container">
    <hr>
    <p><small>xmrgateway {{.Site.Version}} · <a href="https://github.com/RogueTeam/xmrgateway">source</a>{{with .Site.OnionURL}} · <a href="{{.}}">onion service</a>{{end}}</small></p>
  </footer>
</body>
</html>{{end}}
